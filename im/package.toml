# 接入通讯平台 的软件包清单（名字 2026-10-09 项目主人定，原来叫 QQ 桥；施工 O-18，docs/blueprint/onebot.md 第一条、packages.md）：核心照开关拉起桥、经标准输入输出说协议；
# miyu im … 转交给 miyu-im …。给人看的字，不发给模型。

[package]
protocol = [1, 1]
name = { en = "Connect Messaging", zh = "接入通讯平台", ja = "メッセージング接続" }
summary = { en = "Connect the AI to messaging platforms such as QQ, WeChat and Telegram", zh = "把 AI 接入通讯平台，例如 QQ、微信、Telegram 等", ja = "AI を QQ、WeChat、Telegram などのメッセージングプラットフォームにつなぐ" }
# 软件包页上的图标（Lucide 的名字，施工 O-28 上，docs/blueprint/package-pages.md「清单多的几格」）。
icon = "message-circle"
# 作者、上游（核心 F-12，施工 I-4 补）：软件包信息页上露出来。
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu-im"

[command]
name = "im"
program = "miyu-im"
about = { en = "Start, stop and look at Connect Messaging", zh = "开、关、查看接入通讯平台", ja = "メッセージング接続を起動・停止・確認する" }

[process]
args = ["serve"]
start = "manual"
# 要的扩展能力（施工 9-4 下上，05-内核接口.md 第三节）：venue.session、session.send、session.respond 是操作会话，带 as 是代
# 平台上的人发话，subscribe 是读会话，events.append 记 ext.im.*、venue.* 是写事件（施工 O-23），开本机的两个端口、NapCat
# 连进来是联网；provide 是提供工具：桥给场所会话登记 skip_reply 这些平台工具（施工 O-26，docs/blueprint/onebot.md 第一条
# 「提供者和不说话」）；packages.call 是调别的包导出的方法：挂接点（施工 O-43 上，docs/blueprint/extending.md 第二条）；widgets 是终端、
# 网页里场所卡片的两页（施工 O-58 下）。出厂的包算批过的，不用人批。
capabilities = ["tools", "sessions.drive", "act_for_external", "events.read", "events.write", "network", "packages.call", "context.system", "widgets"]
# 自己的系统账号 onebot（施工 O-4 下，06-多用户与身份.md U14）：群、陌生人私聊的场所会话归它，桥以它的身份连进来。
system_account = true

# 平台接入（施工 F-2，设计 30 第五节）：接入本身（开关、配置项）在头的接入页，不进预设。它登记的平台工具是一个功能「QQ 工具」，
# 照 18 Q16 归预设管（F-3）：只有这一个功能，桥登记的工具都归它。
[connection]
platform = "qq"

[features.qq]
name = { en = "QQ tools", zh = "QQ 工具", ja = "QQ ツール" }

# 对话以外调模型的两处（施工 I-42，核心 Q-3）：照档位从固定池取，人不用为它们另配模型；场所卡片上配了判断模型的照卡片。
[[side]]
id = "judge"
tier = "lite"
name = { en = "Reply judge", zh = "判断要不要回", ja = "返信の判断" }
summary = { en = "Decides whether to reply when someone talks in a group", zh = "群里有人说话时判断要不要回", ja = "グループで誰かが話したとき、返信するかを判断する" }

[[side]]
id = "approval"
tier = "lite"
name = { en = "Join approval", zh = "入群审批", ja = "参加承認" }
summary = { en = "Checks a request to join a group against its rule", zh = "照群里写的条件判断入群申请", ja = "グループの条件に照らして参加申請を判断する" }

# 给别的包调的方法（施工 O-42，docs/blueprint/extending.md）：别的包经核心的 package.call 只调得到这里列的（核心 X-18）；后台页的
# status、connection.token 不列，只有人调得到。
[export]
methods = ["chat.action", "chat.venue", "chat.media", "chat.send", "chat.note"]

# 后台页（施工 O-28 上，docs/blueprint/onebot.md 第一条「后台页」）：包目录 packages/im/ 下的 page/，入口 index.html；网页把它
# 放在隔离的框里，它读写这个包的设置项、调桥登记的方法（status、connection.token）。
# 场所卡片的两页（施工 O-58 下，docs/blueprint/onebot.md「场所卡片的两页」）：终端、网页里的整页，内容由桥经 widget.set 推，
# 改了经 package.call 调 cards.save_one、cards.add、cards.remove。
[[widget]]
id = "groups"
place = "page"
title = { en = "QQ groups", zh = "QQ 群", ja = "QQ グループ" }
command = "qq-groups"

[[widget]]
id = "friends"
place = "page"
title = { en = "QQ private chats", zh = "QQ 私聊", ja = "QQ 個人チャット" }
command = "qq-friends"

[page]
dir = "page"

# 桥的配置（施工 O-20，docs/blueprint/onebot.md 第一条「软件包清单」）：O-8 起由核心替桥声明（OnebotSettings），这一步挪过来。
# 都只能写系统配置、当场生效：核心拉起桥时在握手的回应里交最终值，变了推 extension.config，桥照新的用。NapCat 的两项在
# 平台那一组（键 im.qq.host、im.qq.listen、im.qq.token，施工 I-3 补；地址是施工 I-27 加的）。

[settings.qq.host]
type = "text"
max = 45
default = "0.0.0.0"
layers = ["system"]
applies = "now"
name = { en = "Listen address", zh = "监听地址", ja = "待ち受けアドレス" }
description = { en = "The address NapCat's reverse WebSocket connects to. 0.0.0.0 accepts other machines and Docker too, and the token keeps strangers out. 127.0.0.1 accepts only this machine.", zh = "NapCat 反向 WebSocket 连进来的地址。0.0.0.0 是别的机器、Docker 里的也能连，外人靠令牌挡；127.0.0.1 是只收本机的。", ja = "NapCat のリバース WebSocket が接続してくるアドレスです。0.0.0.0 はほかのマシンや Docker からも受け付け、部外者はトークンで防ぎます。127.0.0.1 はこのマシンからだけ受け付けます。" }

[settings.qq.listen]
type = "int"
min = 1024
max = 65535
default = 8301
layers = ["system"]
applies = "now"
name = { en = "Port", zh = "端口", ja = "ポート" }
description = { en = "The port NapCat's reverse WebSocket connects to. With NapCat on this machine use ws://127.0.0.1:<port>/ws; on another machine use this machine's address.", zh = "NapCat 反向 WebSocket 连进来的端口。NapCat 在这台机器上的，那边的地址填 ws://127.0.0.1:<端口>/ws；在别的机器上的，填这台机器的地址。", ja = "NapCat のリバース WebSocket が接続してくるポートです。NapCat がこのマシンにあるなら ws://127.0.0.1:<ポート>/ws、ほかのマシンにあるならこのマシンのアドレスを使います。" }

[settings.qq.token]
type = "secret"
layers = ["system"]
applies = "now"
name = { en = "Token", zh = "令牌", ja = "トークン" }
description = { en = "The token NapCat shows when it connects, the same one as in NapCat. Without it NapCat is refused. Paste it on the Connect Messaging page (miyu im web).", zh = "NapCat 连进来时要出示的验证 Token，和 NapCat 那边的一样。没设的，NapCat 连进来会被拒。在接入通讯平台的页面上粘贴（miyu im web）。", ja = "NapCat が接続するときに示す認証トークンで、NapCat 側と同じものです。未設定だと NapCat の接続は拒否されます。メッセージング接続のページ（miyu im web）で貼り付けます。" }

# 识人术（施工 I-10 上，设计 01 第一节第 22 条）：OneBot 驱动带的插件，设置是驱动的配置项，藏起来，只在 im 页面的插件页「识人术」的
# 「设置」里改；总开关是插件页上的开关。
[settings.qq.identity_on]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Identity on", zh = "识人术开着", ja = "なりすまし防止を使う" }
description = { en = "The switch of the Identity plugin.", zh = "识人术插件的总开关。", ja = "なりすまし防止プラグインのスイッチです。" }

[settings.qq.identity_admin]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Protect the terminal admin's name", zh = "保护终端管理员的名字", ja = "端末管理者の名前を守る" }
description = { en = "When someone uses the terminal admin's name with another number, remind the AI.", zh = "有人用了终端管理员的名字、号却对不上，提醒 AI", ja = "端末管理者の名前を別の番号の人が使ったら AI に伝えます。" }

[settings.qq.identity_card]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Protect the AI's own group card", zh = "保护 AI 自己的群名片", ja = "AI 自身のグループ名を守る" }
description = { en = "When someone changes their group card to the AI's, remind the AI.", zh = "有人把群名片改成和 AI 一样，提醒 AI", ja = "グループ名を AI と同じにした人がいたら AI に伝えます。" }

[settings.qq.identity_people]
type = "list"
element = "text"
max = 128
default = []
layers = ["system"]
applies = "now"
hidden = true
name = { en = "People and numbers", zh = "识人映射", ja = "人と番号の対応" }
description = { en = "One per person, written name=QQ number, for example Boss=10001. When someone uses the name with another number, remind the AI.", zh = "一项一个人，写「名字=QQ号」，例如 主人=10001。名字对上、号码对不上的，提醒 AI 这不是那个人。", ja = "一人ずつ「名前=QQ番号」で書きます。例：主人=10001。名前が同じで番号が違う人がいたら AI に伝えます。" }

# 群聊记录、群资料（施工 I-44，设计 06 第 3.7 条）：OneBot 驱动带的插件，同群管理。总开关关了的，它的工具不登记。
[settings.qq.records_on]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Chat records on", zh = "群聊记录开着", ja = "チャット記録を使う" }
description = { en = "The switch of the Chat records plugin.", zh = "群聊记录插件的总开关。", ja = "チャット記録プラグインのスイッチです。" }

[settings.qq.info_on]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Group info on", zh = "群资料开着", ja = "グループ情報を使う" }
description = { en = "The switch of the Group info plugin.", zh = "群资料插件的总开关。", ja = "グループ情報プラグインのスイッチです。" }

# 群管理（施工 Q-1，设计 02）：OneBot 驱动带的插件，同识人术。总开关关了、禁言工具的开关关了的，禁言不登记（改的时候 im 重新登记）。
[settings.qq.admin_on]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Group admin on", zh = "群管理开着", ja = "グループ管理を使う" }
description = { en = "The switch of the Group admin plugin.", zh = "群管理插件的总开关。", ja = "グループ管理プラグインのスイッチです。" }

[settings.qq.admin_mute]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Mute tool", zh = "禁言工具", ja = "ミュートツール" }
description = { en = "Let the AI mute and unmute group members. Turning it off takes the tool away from the AI.", zh = "让 AI 能禁言、解禁群成员。关掉以后 AI 没有这件工具。", ja = "AI がグループメンバーをミュート、ミュート解除できるようにします。オフにすると AI はこのツールを使えません。" }

[settings.qq.admin_mute_min]
type = "int"
min = 1
max = 43200
default = 1
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Shortest mute (minutes)", zh = "最短禁言时长（分钟）", ja = "最短のミュート時間（分）" }
description = { en = "QQ allows 1 minute at the least.", zh = "QQ 最短 1 分钟。", ja = "QQ では最短 1 分です。" }

[settings.qq.admin_mute_max]
type = "int"
min = 1
max = 43200
default = 43200
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Longest mute (minutes)", zh = "最长禁言时长（分钟）", ja = "最長のミュート時間（分）" }
description = { en = "QQ allows 30 days (43200 minutes) at the most.", zh = "QQ 最长 30 天（43200 分钟）。", ja = "QQ では最長 30 日（43200 分）です。" }

[settings.qq.admin_kick]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Kick tool", zh = "踢人工具", ja = "退出ツール" }
description = { en = "Let the AI remove group members, and refuse their later join requests if it chooses. Turning it off takes the tool away from the AI.", zh = "让 AI 能把群成员移出群，也能拒绝他以后的加群申请。关掉以后 AI 没有这件工具。", ja = "AI がグループメンバーを退出させ、必要なら今後の参加申請も拒否できるようにします。オフにすると AI はこのツールを使えません。" }

[settings.qq.admin_log]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Moderation log tool", zh = "查管理记录工具", ja = "管理記録ツール" }
description = { en = "Let the AI look up this group's moderation records and ranking. Turning it off takes the tool away from the AI.", zh = "让 AI 能查这个群的管理记录和排行榜。关掉以后 AI 没有这件工具。", ja = "AI がこのグループの管理記録とランキングを確認できるようにします。オフにすると AI はこのツールを使えません。" }

[settings.qq.admin_records]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Keep moderation records", zh = "记录管理操作", ja = "管理記録を残す" }
description = { en = "Record mutes, unmutes and kicks in each group.", zh = "记下每个群里的禁言、解禁、踢人。", ja = "グループごとのミュート、ミュート解除、退出を記録します。" }

[settings.qq.admin_keep]
type = "int"
min = 10
max = 100000
default = 500
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Records kept per group", zh = "每个群最多留多少条记录", ja = "グループごとに残す記録の数" }
description = { en = "Older records go first.", zh = "超了从旧的删。", ja = "超えたら古いものから消します。" }

[settings.qq.admin_summary]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Member summary", zh = "成员汇总", ja = "メンバーのまとめ" }
description = { en = "Count mutes and kicks per member and rank them, for the AI and the panel.", zh = "照人数被禁言、被踢的次数，排成榜，给 AI 和面板看。", ja = "メンバーごとのミュートと退出の回数を数えてランキングにし、AI とパネルに見せます。" }

[settings.qq.admin_sync_unmute]
type = "bool"
default = true
layers = ["system"]
applies = "now"
hidden = true
name = { en = "Sync other admins' unmutes", zh = "同步群里别的管理员的解禁", ja = "他の管理者のミュート解除も記録する" }
description = { en = "When another admin unmutes someone, record it and tell the AI too.", zh = "群里别的管理员解禁了谁，也记下来、告诉 AI。", ja = "他の管理者が誰かのミュートを解除したときも、記録して AI に伝えます。" }

# 页面服务的端口（施工 I-5 上，设计 01 第九节第 1 条）：im 自己的页面只听本机的这个端口。键是 im.web.port（施工 I-3 补：
# 核心 9287d31d 起清单能多一层组）。
[settings.web.port]
type = "int"
min = 1024
max = 65535
default = 8302
layers = ["system"]
applies = "now"
name = { en = "Web page port", zh = "网页服务端口", ja = "Web ページのポート" }
description = { en = "The port of the Connect Messaging web page, local only.", zh = "接入通讯平台的网页开在这个端口，只给本机访问。", ja = "メッセージング接続の Web ページを開くポートです。このマシンからだけアクセスできます。" }

# 白名单成员（施工 O-27，2026-10-10 项目主人定：原来的键叫 trusted，旧键不认）。
[settings.whitelist]
type = "list"
element = "text"
max = 128
layers = ["system"]
applies = "now"
name = { en = "Whitelist", zh = "白名单成员", ja = "ホワイトリストのメンバー" }
description = { en = 'People who can chat with the AI in private, whose friend requests are accepted, who are not rate-limited or held off while the AI sleeps, and who get a direct reply when they address the AI in groups. Write each as qq:<QQ number>, for example qq:20017.', zh = '能私聊 AI、加 AI 好友自动通过、不受限流和睡觉影响、群里冲 AI 来的直接回的人。每一项写 qq:QQ号，例如 qq:20017。', ja = '個人チャットで話せて、友だち申請が自動で通り、回数制限も休止時間もかからず、グループで AI に向けた発言にはそのまま返事をもらえる人です。一つずつ qq:QQ番号 で書きます。例：qq:20017。' }

# 群里哪些命令的回执发出去几秒后撤回（施工 O-47，2026-10-17 项目主人定：默认只撤清除上下文、清除记忆的）。
[settings.recall_receipts]
type = "list"
element = "text"
max = 64
default = ["clear", "clear-memory"]
layers = ["system"]
applies = "now"
name = { en = "Recalled command receipts", zh = "撤回回执的命令", ja = "返答を取り消すコマンド" }
description = { en = "Commands whose receipts in groups are recalled a few seconds after they are sent. Write the command name without the slash, for example clear. Private chats are never recalled.", zh = "群里这些命令的回执发出去几秒后撤回。写命令名，不带斜杠，例如 clear。私聊的不撤。", ja = "グループでこれらのコマンドの返答を送ってから数秒後に取り消します。コマンド名をスラッシュなしで書きます。例：clear。個人チャットは取り消しません。" }

# 群的三项（施工 O-41，2026-10-17 项目主人定：做成配置项，网页、终端的设置页照清单画；O-58 上群白名单、白名单以外的群、两档
# 限流挪进后台页的场所卡片）。桥照它们拼一份规则文件 60-settings.toml，排在出厂、系统中间：没设的什么都不改；卡片里设了的盖它，
# 系统里名字排在后面的规则文件也盖它（docs/blueprint/onebot.md 第一条「场所规则和出厂数据」第 8 条、「场所卡片」）。

[settings.sleep]
# 挪进了会话默认值（施工 I-7 下二）：藏起来，老的配置照读，桥起来时搬进卡片、去掉这一项。
hidden = true
type = "text"
max = 11
layers = ["system"]
applies = "now"
name = { en = "Sleep hours", zh = "睡觉时间", ja = "休止時間" }
description = { en = "HH:MM-HH:MM in local time, for example 23:00-07:00. In these hours the AI only records; the terminal administrator and whitelisted people can still call it. Empty or off: no sleep.", zh = "写成 HH:MM-HH:MM，照本机的时间，例如 23:00-07:00。这段时间里 AI 只记下、不接话，终端管理员和白名单成员照样叫得动。不填或 off 是不睡。", ja = "HH:MM-HH:MM でこのマシンの時刻で書きます。例：23:00-07:00。この時間は記録だけします。端末の管理者とホワイトリストの人は呼び出せます。空欄か off で眠りません。" }

[settings.keywords]
# 挪进了会话默认值（施工 I-7 下二）：藏起来，老的配置照读，桥起来时搬进卡片、去掉这一项。
hidden = true
type = "list"
element = "text"
max = 64
layers = ["system"]
applies = "now"
name = { en = "Trigger words", zh = "群里的触发词", ja = "グループの呼び出し語" }
description = { en = "A group message that starts with one of these counts as calling the AI, like an @. Case-sensitive; put its name here too.", zh = "群里的话以其中一个词开头，算叫 AI，和 @ 一样。区分大小写；名字也写在这里。", ja = "グループの発言がこのどれかで始まると、@ と同じく AI を呼んだことになります。大文字と小文字を区別します。名前もここに書きます。" }

[settings.strip_period]
type = "bool"
default = true
layers = ["system"]
applies = "now"
name = { en = "Drop the final period", zh = "去掉末尾的句号", ja = "末尾の句点を外す" }
description = { en = "On: a reply ending in a single 。 is sent without it, like people type in chats. Applies to every group and private chat.", zh = "开着的，回话末尾的一个「。」去掉再发，像平常聊天那样。管所有群和私聊。", ja = "オン：返信の末尾の「。」を一つ外して送ります。普段のチャットと同じです。すべてのグループと個人チャットに効きます。" }

[settings.humanlike]
type = "bool"
default = true
layers = ["system"]
applies = "now"
name = { en = "Send like a person, in several messages", zh = "模拟真人一条分多条发送", ja = "人のように何通かに分けて送る" }
description = { en = "On: a reply is split like people chat, at full stops and sometimes at commas, with a short pause between messages. Long or multi-line replies stay whole. Applies to every group and private chat.", zh = "开着的，一句回复照真人聊天的样子分成几条发：句号处断，有时也在逗号处断，每条之间停一会儿。太长的、带换行的照旧一条。管所有群和私聊。", ja = "オン：返信を人のチャットのように何通かに分けて送ります。句点で区切り、ときどき読点でも区切り、間を少し空けます。長い返信や改行を含む返信は一通のままです。すべてのグループと個人チャットに効きます。" }

[settings.show_ids]
