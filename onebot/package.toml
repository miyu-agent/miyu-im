# 接入QQ 的软件包清单（名字 2026-10-09 项目主人定，原来叫 QQ 桥；施工 O-18，docs/blueprint/onebot.md 第一条、packages.md）：核心照开关拉起桥、经标准输入输出说协议；
# miyu onebot … 转交给 miyu-onebot …。给人看的字，不发给模型。

[package]
protocol = [1, 1]
name = { en = "Connect QQ", zh = "接入QQ", ja = "QQ接続" }
summary = { en = "Talk with the AI on QQ through NapCat", zh = "经 NapCat 在 QQ 上和 AI 说话", ja = "NapCat 経由で QQ で会話する" }
# 软件包页上的图标（Lucide 的名字，施工 O-28 上，docs/blueprint/package-pages.md「清单多的几格」）。
icon = "message-circle"

[command]
name = "onebot"
program = "miyu-onebot"
about = { en = "Start, stop and look at Connect QQ", zh = "开、关、查看接入QQ", ja = "QQ接続を起動・停止・確認する" }

[process]
args = ["serve"]
start = "manual"
# 要的扩展能力（施工 9-4 下上，05-内核接口.md 第三节）：venue.session、session.send、session.respond 是操作会话，带 as 是代
# 平台上的人发话，subscribe 是读会话，events.append 记 ext.onebot.*、venue.* 是写事件（施工 O-23），开本机的两个端口、NapCat
# 连进来是联网；provide 是提供工具：桥给场所会话登记 skip_reply 这些平台工具（施工 O-26，docs/blueprint/onebot.md 第一条
# 「提供者和不说话」）；packages.call 是调别的包导出的方法：挂接点（施工 O-43 上，docs/blueprint/extending.md 第二条）。出厂的包算批过的，不用人批。
capabilities = ["tools", "sessions.drive", "act_for_external", "events.read", "events.write", "network", "packages.call"]
# 自己的系统账号 onebot（施工 O-4 下，06-多用户与身份.md U14）：群、陌生人私聊的场所会话归它，桥以它的身份连进来。
system_account = true

# 平台接入（施工 F-2，设计 30 第五节）：接入本身（开关、配置项）在头的接入页，不进预设。它登记的平台工具是一个功能「QQ 工具」，
# 照 18 Q16 归预设管（F-3）：只有这一个功能，桥登记的工具都归它。
[connection]
platform = "qq"

[features.qq]
name = { en = "QQ tools", zh = "QQ 工具", ja = "QQ ツール" }

# 给别的包调的方法（施工 O-42，docs/blueprint/extending.md）：别的包经核心的 package.call 只调得到这里列的（核心 X-18）；后台页的
# status、connection.token 不列，只有人调得到。
[export]
methods = ["qq.action", "qq.venue"]

# 后台页（施工 O-28 上，docs/blueprint/onebot.md 第一条「后台页」）：包目录 packages/onebot/ 下的 page/，入口 index.html；网页把它
# 放在隔离的框里，它读写这个包的设置项、调桥登记的方法（status、connection.token）。
[page]
dir = "page"

# 桥的配置（施工 O-20，docs/blueprint/onebot.md 第一条「软件包清单」）：O-8 起由核心替桥声明（OnebotSettings），这一步挪过来。
# 都只能写系统配置、当场生效：核心拉起桥时在握手的回应里交最终值，变了推 extension.config，桥照新的用。

[settings.listen]
type = "int"
min = 1024
max = 65535
default = 8301
layers = ["system"]
applies = "now"
name = { en = "Port", zh = "端口", ja = "ポート" }
description = { en = "The port NapCat's reverse WebSocket connects to, local only. In NapCat use ws://127.0.0.1:<port>/ws.", zh = "NapCat 反向 WebSocket 连进来的端口，只听本机。NapCat 那边的地址填 ws://127.0.0.1:<端口>/ws。", ja = "NapCat のリバース WebSocket が接続してくるポートです。このマシンからだけ受け付けます。NapCat 側のアドレスは ws://127.0.0.1:<ポート>/ws です。" }

[settings.token]
type = "secret"
layers = ["system"]
applies = "now"
name = { en = "Token", zh = "令牌", ja = "トークン" }
description = { en = "The access token NapCat shows when it connects; set the same one in NapCat. Without it NapCat is refused; you can generate one on Connect QQ web page.", zh = "NapCat 连进来时要出示的访问令牌，NapCat 那边填同一个。没设的，NapCat 连进来会被拒；在接入QQ的网页上能生成一个。", ja = "NapCat が接続するときに示すアクセストークンです。NapCat 側にも同じものを設定します。未設定だと NapCat の接続は拒否されます。QQ接続の Web ページで生成できます。" }

# 白名单成员（施工 O-27，2026-10-10 项目主人定：原来的键叫 trusted，旧键不认）。
[settings.whitelist]
type = "list"
element = "text"
max = 128
layers = ["system"]
applies = "now"
name = { en = "Whitelist", zh = "白名单成员", ja = "ホワイトリスト" }
description = { en = 'People who can chat with the AI in private, whose friend requests are accepted, who are not rate-limited or held off while the AI sleeps, and who get a direct reply when they address the AI in groups. Write each as qq:<QQ number>, for example qq:20017.', zh = '能私聊 AI、加 AI 好友自动通过、不受限流和睡觉影响、群里冲 AI 来的直接回的人。每一项写 qq:QQ号，例如 qq:20017。', ja = '個人チャットで話せて、友だち申請が自動で通り、回数制限も睡眠時間もかからず、グループで AI に向けた発言にはそのまま返事をもらえる人です。一つずつ qq:QQ番号 で書きます。例：qq:20017。' }

# 群的七项（施工 O-41，2026-10-17 项目主人定：做成配置项，网页、终端的设置页照清单画；照旧版加群白名单，白名单以外的群默认照样
# 接话）。桥照它们拼一份规则文件 60-settings.toml，排在出厂、系统中间：没设的什么都不改，系统里名字排在后面的规则文件盖它
# （docs/blueprint/onebot.md 第一条「场所规则和出厂数据」第 8 条）。

[settings.groups]
type = "list"
element = "int"
min = 1
layers = ["system"]
applies = "now"
name = { en = "Group whitelist", zh = "群白名单", ja = "グループのホワイトリスト" }
description = { en = "Group numbers. Whitelisted groups use their own rate limit; with “Other groups” off, the AI only talks in these groups. A rule file that sets something for a group wins.", zh = "群号的列表。白名单群用自己的限流；「白名单以外的群」关了以后，AI 只在这些群里接话。规则文件里给某个群写了的，照文件。", ja = "グループ番号の一覧です。ホワイトリストのグループは専用の回数制限を使います。「ホワイトリスト外のグループ」をオフにすると、AI はこれらのグループでだけ話します。ルールファイルでグループに設定したものはそちらが優先です。" }

[settings.other_groups]
type = "bool"
default = true
layers = ["system"]
applies = "now"
name = { en = "Other groups", zh = "白名单以外的群", ja = "ホワイトリスト外のグループ" }
description = { en = "On: the AI also talks in groups outside the whitelist. Off: it only records them; the terminal administrator can still call it.", zh = "开着的，白名单以外的群里 AI 也接话；关了只记下，终端管理员照样叫得动。", ja = "オン：ホワイトリスト外のグループでも AI が話します。オフ：記録だけします。端末の管理者は呼び出せます。" }

[settings.group_rate]
type = "text"
max = 32
layers = ["system"]
applies = "now"
name = { en = "Whitelisted group rate limit", zh = "白名单群的限流", ja = "ホワイトリストのグループの回数制限" }
description = { en = "Turns per time span, for example 5/300s is at most 5 turns in 5 minutes; 0 is no limit. Empty follows the venue rules (5/300s as shipped).", zh = "写成「回合数/时长」，例如 5/300s 是 5 分钟最多 5 个回合，0 是不限。不填照场所规则（出厂 5/300s）。", ja = "「ターン数/時間」で書きます。例えば 5/300s は 5 分間に最大 5 ターン、0 は無制限です。空欄は場所のルールに従います（出荷時 5/300s）。" }

[settings.other_group_rate]
type = "text"
max = 32
layers = ["system"]
applies = "now"
name = { en = "Other groups rate limit", zh = "其他群的限流", ja = "ほかのグループの回数制限" }
description = { en = "Same form as the whitelisted one, for groups outside the whitelist. Empty follows the venue rules (5/300s as shipped).", zh = "写法同白名单群的，管白名单以外的群。不填照场所规则（出厂 5/300s）。", ja = "書き方はホワイトリストのものと同じで、ホワイトリスト外のグループに使います。空欄は場所のルールに従います（出荷時 5/300s）。" }

[settings.sleep]
type = "text"
max = 11
layers = ["system"]
applies = "now"
name = { en = "Sleep hours", zh = "睡觉时间", ja = "睡眠時間" }
description = { en = "HH:MM-HH:MM in local time, for example 23:00-07:00. In these hours the AI only records; the terminal administrator and whitelisted people can still call it. Empty or off: no sleep.", zh = "写成 HH:MM-HH:MM，照本机的时间，例如 23:00-07:00。这段时间里 AI 只记下、不接话，终端管理员和白名单成员照样叫得动。不填或 off 是不睡。", ja = "HH:MM-HH:MM でこのマシンの時刻で書きます。例：23:00-07:00。この時間は記録だけします。端末の管理者とホワイトリストの人は呼び出せます。空欄か off で眠りません。" }

[settings.keywords]
type = "list"
element = "text"
max = 64
layers = ["system"]
applies = "now"
name = { en = "Trigger words", zh = "群里的触发词", ja = "グループの呼び出し語" }
description = { en = "A group message that starts with one of these counts as calling the AI, like an @. Case-sensitive; put its name here too.", zh = "群里的话以其中一个词开头，算叫 AI，和 @ 一样。区分大小写；名字也写在这里。", ja = "グループの発言がこのどれかで始まると、@ と同じく AI を呼んだことになります。大文字と小文字を区別します。名前もここに書きます。" }

[settings.show_ids]
type = "bool"
default = false
layers = ["system"]
applies = "now"
name = { en = "Show QQ numbers", zh = "让 AI 看到 QQ 号", ja = "QQ 番号を AI に見せる" }
description = { en = "On: the AI sees the QQ number of whoever speaks, next to the name.", zh = "开着的，AI 看得到发话人的 QQ 号，写在名字旁边。", ja = "オン：発言した人の QQ 番号を名前の横に AI が見られます。" }
