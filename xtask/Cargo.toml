[package]
name = "xtask"
description = "接入通讯平台 仓库的门禁：cargo xtask check（照核心仓库的 xtask，施工 S-6 中）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 只用来读 cargo metadata 的输出（许可证）。
serde_json = "1.0"
# 登记簿的指纹：文件字节的 SHA-256。版本和群聊内核用的一样。
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
