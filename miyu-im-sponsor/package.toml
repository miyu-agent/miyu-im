# 赞助记录（设计 03，施工 S-1 上b）：im 的插件，通讯平台上的人给主人赞助了，主人叫 AI 记一笔；谁都能查。给人看的字，不发给模型。

[package]
# 版本、能装的系统（施工 I-126，进官方软件源要的）：版本两个包一样，打标签 `v<版本>` 发版；系统是三台 CI 测过的那三种，
# 一种打一个 `.miyu`（`.github/workflows/release.yml`）。
version = "0.2.0"
targets = ["linux-x86_64", "macos-aarch64", "windows-x86_64"]
protocol = [1, 1]
name = { en = "Sponsorships", zh = "赞助记录", ja = "スポンサー記録" }
summary = { en = "The AI records sponsorships when an admin asks, and anyone can look them up", zh = "管理员叫 AI 记赞助，谁都能查", ja = "管理者に頼まれてスポンサーを記録し、誰でも確認できる" }
icon = "hand-coins"
author = "miyu-agent"
upstream = "https://github.com/miyu-agent/miyu-im"

[command]
name = "sponsor"
program = "miyu-im-sponsor"
about = { en = "Sponsorships", zh = "赞助记录", ja = "スポンサー記録" }

[process]
args = ["serve"]
start = "always"
# tools：登记 `sponsor`；packages.call：调 im 的 `chat.venue` 认是哪个场所、叫 AI 的那一条引用了谁、@ 了谁（设计 03 补定第 1 条）；
# network：查汇率（open.er-api.com）。
capabilities = ["tools", "packages.call", "network"]

# 后台页（施工 S-1 下，设计 03 第一节第 6 条）：网页的「软件后台」、im 插件卡片的「打开面板」打开的都是它。
# 给别的包调的（施工 I-131）：迁移程序经 package.call 把旧版的赞助记录导进来、导出备份；照样经 package.methods 登记。
[export]
methods = ["import", "export"]

[page]
dir = "page"

# im 的插件（设计 01 第四节）：给 im（包编号 miyu-im，施工 I-86）带 `im/plugin.toml`，出现在 im 的插件页，场所开关照 im 的场所卡片。
[content.miyu-im]
dir = "im"

[settings.currency]
type = "text"
default = "CNY"
layers = ["system"]
applies = "now"
name = { en = "Default currency", zh = "默认币种", ja = "既定の通貨" }
