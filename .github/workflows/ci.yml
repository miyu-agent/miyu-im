# 三平台 CI（施工 S-6 中，照核心仓库、终端仓库那一份）：每台机器跑 cargo xtask check，和本机验收是同一条命令：格式、clippy、
# 文档（含登记簿对账）、纯逻辑、行数、许可证、测试。核心照根目录 Cargo.toml 里 git 依赖钉住的那个提交取，测试拼的出厂资源目录也照
# 那份检出。
name: CI

on:
  push:
    branches: [main, "step/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # 测试卡住时不白等 GitHub 默认的六个小时（同核心）。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux 钉 24.04：同核心，发行构建以 glibc 2.39 为基线。
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      # 第三方依赖和钉住的核心的编译产物：只有 main 上的那一次存，分支照 main 的取（同核心）。
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
      # 卡住抓栈的脚本超时掐得干净（组织审计 #189）：几秒钟，Windows 不用它。
      - name: hang-watch 掐得干净
        if: runner.os != 'Windows'
        run: .github/hang-watch-test.sh
      - name: 门禁
        if: runner.os != 'macOS'
        run: cargo xtask check
      # macOS 上偶尔卡住（I-15、I-24 各见过）：过了 30 分钟抓测试进程的栈再判失败，不白等到 45 分钟被掐。
      - name: 门禁（卡住抓栈）
        if: runner.os == 'macOS'
        run: .github/hang-watch.sh cargo xtask check

  # 排函数（施工 LW-IM-9，`cargo xtask order`）：只在手动跑的时候跑（workflow_dispatch），验它在 CI 的机器上录得出、排得上；要十来
  # 分钟，不进每次推送都跑的那一组。发版时由 `release.yml` 的 Linux x86_64 那一份跑同一条命令。
  order:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 装 QEMU 的用户态模拟器
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: 录清单、重链、核对
        run: cargo xtask order
      - name: 清单放进产物
        uses: actions/upload-artifact@v4
        with:
          name: miyu-im-order
          path: target/order/miyu-im.txt
