[package]
name = "miyu-im"
description = "接入通讯平台的宿主（设计 01，施工 I-2 下）：场所会话、群聊、插件挂接点、给模型的工具，和平台无关；平台由驱动接（miyu-im-onebot）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 核心里的东西只经门面拿（设计 32 第九节第 1 条，施工 S-6 上；施工 S-6 中起照 git 钉核心的提交，见根目录 Cargo.toml）：数据根、资源目录、系统的语言（`places`）；给人看的字（`texts`）；
# 运行日志 `state/logs/im.log`，满了照核心的换法（`log`）；`start`、`stop`、`restart`、`status` 照终端的样子连核心、一问一答
# （`open::Core`，onebot.md「施工时定的」第 166 条）；场所、平台上的人的编号、时刻、事件（`ids`、`time`、`events`）；桥的工具的
# 说明、答的几句照工具的读法读（`tooltext`，施工 O-26，`providers.md`「给模型看的字」）；令牌是核心交来的密钥（`settings`，`Debug`
# 只印 `Secret(…)`）；两个端口的默认值照自己的清单读（`manifest`，施工 O-20）；取图、视频、文件照核心的 HTTP 客户端下（`http`，
# 施工 O-33：只 http、https，超时、代理照它）。配置由核心在握手时交、变了推过来，桥不依赖核心的 crate（`miyu-core`、
# `miyu-endpoint`，18 第一节）。
miyu-client = { workspace = true }
# 下平台给的地址时过核心的地址闸（施工 I-96，`media/guarded.rs`；闸、代理、TLS 经门面 `miyu_client::http` 拿）：那一段自己跟跳转、
# 钉解析好的地址，要直接用客户端，和核心的 miyu-http 用的同一版、同几个特性（不另带一份 TLS）。MIT OR Apache-2.0。
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# 群聊内核（第 2 层）：场所、平台上的人的编号经它拼，桥不手拼（`chat.md` 第七条第 1 条）。
miyu-chat = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 页面服务（施工 I-5 上）：HTTP/1、升级成 WebSocket 的通道，和驱动接 NapCat 用的同一套、同一份。MIT。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# 跟核心说的命令编号的随机前缀：桥重启以后不撞上一次的编号（`venue.session` 同一个编号交回上一次的那一个）。
getrandom = { version = "0.4", features = ["std"] }
# OneBot 和核心协议都是 JSON；读 `bridge.json`。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `io-std`：`serve` 的标准输入输出是跟核心说协议的管道（施工 O-18）。`fs`：页面服务读页面的文件（施工 I-5 上）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# NapCat 回的 base64 解出来、`blob.write` 分块上传时编成 base64（施工 O-33）。本来就在依赖图里，和核心用的同一份。MIT OR
# Apache-2.0。
base64 = "0.22"
# 聊天记录（设计 04，施工 C-1 上）：im 自己的 SQLite 库，正文的全文索引用 FTS5。和核心用的同一版、同一份（`bundled`，不靠系统的
# SQLite）。MIT。
rusqlite = { version = "0.40", features = ["bundled"] }
# 读插件的声明 `plugin.toml`（施工 I-8 上）：照类型读、认不出的键不收。和群聊内核读规则用的 `toml_edit` 是同一家、同一份
# 解析器。MIT OR Apache-2.0。
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# 本机此刻的时区偏移：群里的睡觉时间照它换成当地时间（施工 O-22，和核心造会话时钉下时区的办法一样）。本来就在依赖图里
# （`miyu-log` 用它）。Unlicense 或 MIT。
jiff = "0.2"
# 局域网网址照网卡全列（施工 I-193，同网页软件 W-1135）：列这台电脑的网卡和地址。MIT OR BSD-3-Clause。
if-addrs = "0.13"

[target.'cfg(unix)'.dependencies]
# 传文件给外人的会话钉文件时从工作区一级一级往下开、每一级都不跟链接（施工 I-185 下下，`openat` + `O_NOFOLLOW`）：安全 API，不用
# unsafe。核心本来就带它（同一版）。Apache-2.0 WITH LLVM-exception、Apache-2.0 或 MIT。
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[features]
# 测试用的假连接（`chat::fake`，施工 I-70 中上）：驱动的集成测试里挂一个假的第二个平台用。只开一个模块，不多依赖什么。
fake = []

[lints]
workspace = true

[dev-dependencies]
# 这个 crate 自己只有单元测试。起真核心跑的测试在 `crates/miyu-im-app/tests/`（施工 I-183 上搬过去的），要核心别的 crate 的
# 开发依赖写在那边，这里不带（施工 AUD-1：原来的十个没人用，单编这个 crate 的测试时白编一遍核心）。
miyu-client = { workspace = true, features = ["testkit"] }
# 测试里照核心的读法读配置项（`rules/cards/tests.rs`、`rules/configured/tests.rs`）。
miyu-config = { workspace = true }
# 下平台给的地址的测试：本机回环上的假服务器（`media/guarded/tests.rs`）。
miyu-http = { workspace = true, features = ["testkit"] }
# `test-util`：钟停住的测试（`start_paused`）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util", "process"] }
