[package]
name = "miyu-im"
description = "接入通讯平台的宿主（设计 01，施工 I-2 下）：场所会话、群聊、插件挂接点、给模型的工具，和平台无关；平台由驱动接（miyu-im-onebot）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 核心里的东西只经门面拿（设计 32 第九节第 1 条，施工 S-6 上；施工 S-6 中起照 git 钉核心的提交，见根目录 Cargo.toml）：数据根、资源目录、系统的语言（`places`）；给人看的字（`texts`）；
# 运行日志 `state/logs/im.log`，满了照核心的换法（`log`）；`start`、`stop`、`restart`、`status` 照终端的样子连核心、一问一答
# （`open::Core`，onebot.md「施工时定的」第 166 条）；场所、平台上的人的编号、时刻、事件（`ids`、`time`、`events`）；桥的工具的
# 说明、答的几句照工具的读法读（`tooltext`，施工 O-26，`providers.md`「给模型看的字」）；令牌是核心交来的密钥（`settings`，`Debug`
# 只印 `Secret(…)`）；两个端口的默认值照自己的清单读（`manifest`，施工 O-20）；取图、视频、文件照核心的 HTTP 客户端下（`http`，
# 施工 O-33：只 http、https，超时、代理照它）。配置由核心在握手时交、变了推过来，桥不依赖核心的 crate（`miyu-core`、
# `miyu-endpoint`，18 第一节）。
miyu-client = { workspace = true }
# 群聊内核（第 2 层）：场所、平台上的人的编号经它拼，桥不手拼（`chat.md` 第七条第 1 条）。
miyu-chat = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 跟核心说的命令编号的随机前缀：桥重启以后不撞上一次的编号（`venue.session` 同一个编号交回上一次的那一个）。
getrandom = { version = "0.4", features = ["std"] }
# OneBot 和核心协议都是 JSON；读 `bridge.json`。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `io-std`：`serve` 的标准输入输出是跟核心说协议的管道（施工 O-18）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# NapCat 回的 base64 解出来、`blob.write` 分块上传时编成 base64（施工 O-33）。本来就在依赖图里，和核心用的同一份。MIT OR
# Apache-2.0。
base64 = "0.22"
# 本机此刻的时区偏移：群里的睡觉时间照它换成当地时间（施工 O-22，和核心造会话时钉下时区的办法一样）。本来就在依赖图里
# （`miyu-log` 用它）。Unlicense 或 MIT。
jiff = "0.2"

[lints]
workspace = true

[dev-dependencies]
# 测试里核心的替身、头经本机套接字连核心（施工 O-16；O-28 下桥自己不再直接用它）。
miyu-ipc = { workspace = true }
# 测试照钉住的那份核心检出拼出厂的资源目录（`WORKSPACE_ROOT`，施工 S-6 中：核心的资源目录以后没有 `packages/im/`，
# 把这个仓库的 `im/` 放进去，`tests/support/assembled.rs`）。
miyu-client = { workspace = true, features = ["testkit"] }
# 测试里造编号、读会话日志、装记日志的订阅者、拼请求这些门面上没有的（施工 S-6 上以前是正式依赖）。
miyu-store = { workspace = true }
miyu-log = { workspace = true }
miyu-kernel = { workspace = true }
miyu-tool = { workspace = true }
miyu-config = { workspace = true }
# 测试里在进程里起一个真的核心：协议端点、请求模型照剧本回、读会话日志；配置清单照真核心起来时那样拼进出厂的包的配置项
# （`miyu_core::settings::Packaged`，施工 O-20）。不要核心的可选软件包。
miyu-core = { workspace = true }
# 测试里的核心只装基础系统的 `show` 一件（施工 O-46：她给人看文件，桥发进 QQ），别的测试照旧不装工具。
miyu-basesystem = { workspace = true }
miyu-endpoint = { workspace = true }
miyu-session = { workspace = true, features = ["testkit"] }
# 判官的替身（施工 O-23 下）：`model.call` 走核心真的一次性入口，发到本机回环上的假服务器；模型资料、档案照它造。
miyu-http = { workspace = true, features = ["testkit"] }
miyu-models = { workspace = true }
# 测试里的假 NapCat 是一个 WebSocket 客户端（客户端的握手）。
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# `process`：测试当核心跑真的 `serve`、`logs -f`（施工 O-18）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util", "process"] }
